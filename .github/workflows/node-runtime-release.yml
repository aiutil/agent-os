name: Verified desktop and node release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified assets to aiutil/agent-os and the v0.3.9 legacy migration bridge
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: node-runtime-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize-publish-source:
    name: Authorize publish source
    runs-on: ubuntu-24.04
    steps:
      - name: Require main for external publish
        if: ${{ inputs.publish && github.ref != 'refs/heads/main' }}
        run: |
          echo "publish=true is only allowed from refs/heads/main; got $GITHUB_REF" >&2
          exit 1

  build:
    name: Build ${{ matrix.platform }}
    needs: authorize-publish-source
    env:
      MIXPANEL_PRODUCTION_TOKEN: ${{ secrets.MIXPANEL_PRODUCTION_TOKEN }}
      MIXPANEL_DEV_TOKEN: ${{ secrets.MIXPANEL_DEV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac-arm64
            runner: macos-14
            desktop_command: npx electron-builder --mac dmg --arm64 --publish never -c.forceCodeSigning=true
          - platform: mac-x64
            runner: macos-15-intel
            desktop_command: npx electron-builder --mac dmg --x64 --publish never -c.forceCodeSigning=true
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            desktop_command: npx electron-builder --linux AppImage --arm64 --publish never
          - platform: linux-x64
            runner: ubuntu-24.04
            desktop_command: npx electron-builder --linux AppImage deb --x64 --publish never
          - platform: win-x64
            runner: windows-2022
            desktop_command: npx electron-builder --win nsis --x64 --publish never
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # package-lock.json is generated with legacy peer resolution because
      # @lobehub/icons exposes an optional React 19 UI peer while Agent OS uses React 18.
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: node scripts/build-node-dist.cjs
      - name: Prepare fixed self-signed macOS code-signing credentials
        if: ${{ startsWith(matrix.platform, 'mac-') }}
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
        run: |
          for key in CSC_LINK CSC_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "Missing required macOS release secret: $key" >&2
              exit 1
            fi
          done
          signing_keychain="$RUNNER_TEMP/agentos-self-signing.keychain-db"
          signing_p12="$RUNNER_TEMP/agentos-self-signing.p12"
          signing_cert="$RUNNER_TEMP/agentos-self-signing.pem"
          signing_trust="$RUNNER_TEMP/agentos-self-signing-trust.plist"
          keychain_password="$(openssl rand -hex 24)"
          echo "CSC_KEYCHAIN=$signing_keychain" >> "$GITHUB_ENV"
          echo "CSC_P12_PATH=$signing_p12" >> "$GITHUB_ENV"
          echo "CSC_CERT_PATH=$signing_cert" >> "$GITHUB_ENV"
          echo "CSC_TRUST_SETTINGS_PATH=$signing_trust" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"
          printf '%s' "$CSC_LINK" | base64 -D > "$signing_p12"
          echo "CSC_NAME=Agent OS Self-Signed" >> "$GITHUB_ENV"
      - name: Create isolated macOS signing keychain
        if: ${{ startsWith(matrix.platform, 'mac-') }}
        shell: bash
        run: |
          security create-keychain -p "$CSC_KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN"
          security unlock-keychain -p "$CSC_KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$CSC_KEYCHAIN"
          security list-keychains -d user -s "$CSC_KEYCHAIN"
      - name: Import fixed self-signed macOS identity
        if: ${{ startsWith(matrix.platform, 'mac-') }}
        shell: bash
        env:
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
        run: |
          security import "$CSC_P12_PATH" -k "$CSC_KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security find-certificate -c "Agent OS Self-Signed" -p "$CSC_KEYCHAIN" > "$CSC_CERT_PATH"
      - name: Import fixed identity trust settings on ephemeral macOS runner
        if: ${{ startsWith(matrix.platform, 'mac-') }}
        shell: bash
        run: |
          security add-trusted-cert -p codeSign -r trustRoot -k "$CSC_KEYCHAIN" \
            -o "$CSC_TRUST_SETTINGS_PATH" "$CSC_CERT_PATH"
          security trust-settings-import "$CSC_TRUST_SETTINGS_PATH"
      - name: Grant macOS codesign key partition access
        if: ${{ startsWith(matrix.platform, 'mac-') }}
        shell: bash
        run: |
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CSC_KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN"
      - name: Validate fixed macOS signing identity
        if: ${{ startsWith(matrix.platform, 'mac-') }}
        shell: bash
        run: |
          security find-identity -v -p codesigning "$CSC_KEYCHAIN" | grep '"Agent OS Self-Signed"'
      - name: Build native desktop installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ startsWith(matrix.platform, 'mac-') && 'true' || 'false' }}
        run: ${{ matrix.desktop_command }}
      - name: Verify fixed macOS self-signature and reject ad-hoc output
        if: ${{ startsWith(matrix.platform, 'mac-') }}
        shell: bash
        run: |
          shopt -s nullglob
          dmg=(release/Agent-Os-*-mac-*.dmg)
          if [ "${#dmg[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS DMG, found ${#dmg[@]}" >&2
            exit 1
          fi
          node build/verify-macos-release.cjs "${dmg[0]}"
      - name: Build native Linux ARM64 deb
        if: ${{ matrix.platform == 'linux-arm64' }}
        run: node scripts/build-linux-deb.cjs
      - name: Stage native release assets for cross-runner merge
        shell: bash
        run: |
          stage_dir="release/.transport/${{ matrix.platform }}"
          mkdir -p "$stage_dir"
          cp release/agentos-node-*.tar.gz "$stage_dir/"
          cp release/Agent-Os-* "$stage_dir/"
          cp release/agentos-desktop-*-manifest.json "$stage_dir/"
      # Actions Artifact has a small account-wide quota whose deletion is recalculated only
      # every 6–12 hours. Release assets use the separate 10 GB Actions Cache as an ephemeral,
      # run-scoped transport; provenance/exact-set checks still gate the public Release.
      - uses: actions/cache/save@v4
        with:
          path: release/.transport/${{ matrix.platform }}
          key: release-assets-${{ github.run_id }}-${{ matrix.platform }}
          enableCrossOsArchive: true
      - name: Remove temporary macOS signing material
        if: ${{ always() && startsWith(matrix.platform, 'mac-') }}
        shell: bash
        run: |
          if [ -n "${CSC_KEYCHAIN:-}" ]; then
            security delete-keychain "$CSC_KEYCHAIN" || true
          fi
          for generated_file in "${CSC_P12_PATH:-}" "${CSC_CERT_PATH:-}" "${CSC_TRUST_SETTINGS_PATH:-}"; do
            if [ -n "$generated_file" ] && [ -f "$generated_file" ]; then
              unlink "$generated_file"
            fi
          done

  verify-and-publish:
    name: Verify and optionally publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: npm
      - uses: actions/cache/restore@v4
        with:
          path: release/.transport/mac-arm64
          key: release-assets-${{ github.run_id }}-mac-arm64
          fail-on-cache-miss: true
          enableCrossOsArchive: true
      - uses: actions/cache/restore@v4
        with:
          path: release/.transport/mac-x64
          key: release-assets-${{ github.run_id }}-mac-x64
          fail-on-cache-miss: true
          enableCrossOsArchive: true
      - uses: actions/cache/restore@v4
        with:
          path: release/.transport/linux-arm64
          key: release-assets-${{ github.run_id }}-linux-arm64
          fail-on-cache-miss: true
          enableCrossOsArchive: true
      - uses: actions/cache/restore@v4
        with:
          path: release/.transport/linux-x64
          key: release-assets-${{ github.run_id }}-linux-x64
          fail-on-cache-miss: true
          enableCrossOsArchive: true
      - uses: actions/cache/restore@v4
        with:
          path: release/.transport/win-x64
          key: release-assets-${{ github.run_id }}-win-x64
          fail-on-cache-miss: true
          enableCrossOsArchive: true
      - name: Merge native release assets
        run: |
          mkdir -p release
          find release/.transport -type f -exec cp {} release/ \;
      - name: Generate aggregate manifest
        run: node scripts/generate-node-release-manifest.cjs
      - name: Enforce runtime and release gates
        run: node scripts/release-gh.cjs --dry-run
      - name: Require legacy migration release credential
        if: ${{ inputs.publish }}
        env:
          LEGACY_RELEASE_TOKEN: ${{ secrets.LEGACY_RELEASE_TOKEN }}
        run: test -n "$LEGACY_RELEASE_TOKEN"
      - name: Stage verified canonical private Release draft
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-gh.cjs --repo aiutil/agent-os --stage-only
      - name: Stage byte-identical legacy migration draft
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.LEGACY_RELEASE_TOKEN }}
        run: node scripts/release-gh.cjs --repo lohasle/agent-life --stage-only
      - name: Verify canonical and legacy drafts are byte-identical
        if: ${{ inputs.publish }}
        env:
          CANONICAL_GH_TOKEN: ${{ github.token }}
          LEGACY_GH_TOKEN: ${{ secrets.LEGACY_RELEASE_TOKEN }}
        run: node scripts/verify-release-mirror.cjs --draft
      - uses: actions/cache/save@v4
        with:
          path: |
            release/agentos-node-*
            release/agentos-release-*-provenance.json
            scripts/install-node.sh
          key: node-runtime-release-bundle-${{ github.run_id }}
      - name: Verify Agent OS Page and README are synchronized
        if: ${{ inputs.publish }}
        run: |
          node scripts/sync-agent-life-site.cjs --repo-dir "$GITHUB_WORKSPACE" --site-dir "$GITHUB_WORKSPACE/site" --check
      - name: Wait for public Page and README
        if: ${{ inputs.publish }}
        run: |
          for attempt in $(seq 1 30); do
            if node scripts/check-public-release-consistency.cjs --pre-publish; then exit 0; fi
            if [ "$attempt" -lt 30 ]; then sleep 10; fi
          done
          exit 1
      - name: Promote verified canonical draft to Latest
        id: promote
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-gh.cjs --repo aiutil/agent-os --promote-only
      - name: Verify public version surfaces after publish
        if: ${{ inputs.publish }}
        run: |
          for attempt in $(seq 1 30); do
            if npm run verify:release-consistency; then exit 0; fi
            if [ "$attempt" -lt 30 ]; then sleep 10; fi
          done
          exit 1
      - name: Verify five public node assets after publish
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run verify:node-release-public
      - name: Promote legacy migration bridge after canonical verification
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.LEGACY_RELEASE_TOKEN }}
        run: node scripts/release-gh.cjs --repo lohasle/agent-life --promote-only
      - name: Verify public canonical and legacy releases are byte-identical
        if: ${{ inputs.publish }}
        env:
          CANONICAL_GH_TOKEN: ${{ github.token }}
          LEGACY_GH_TOKEN: ${{ secrets.LEGACY_RELEASE_TOKEN }}
        run: node scripts/verify-release-mirror.cjs
